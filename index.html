<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComDex</title>
  <link rel="icon" type="image/jpeg" href="img/logo.jpg">
<style>
:root{
  --bg:#17171a;
  --panel:#1d1d21;
  --panel2:#26262b;
  --panel3:#2f2f35;
  --border-soft:#2a2a30;
  --text:#edeef0;
  --text-dim:#93939a;
  --text-dim2:#6d6d74;
  --accent:#8577f8;
  --accent-strong:#7263f2;
  --accent-soft:rgba(133,119,248,.15);
  --danger:#f2495c;
  --danger-soft:rgba(242,73,92,.14);
  --model:#14b8a6;
  --ok:#3ecf7e;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:11px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-y:auto;
  -webkit-font-smoothing:antialiased;
}
body::-webkit-scrollbar{width:9px;}
body::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}

#particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

.logo-corner{
  position:fixed;
  top:26px;
  left:28px;
  width:40px;
  height:40px;
  border-radius:var(--radius-sm);
  overflow:hidden;
  z-index:2;
  background:var(--panel2);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.logo-corner img{width:100%;height:100%;object-fit:cover;display:block;}

.home-wrap{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:120px 24px 70px;
  gap:46px;
}

.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  width:100%;
  max-width:560px;
}

.btn-create{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  color:#fff;
  border:none;
  width:100%;
  padding:18px 24px;
  border-radius:20px;
  font-size:15.5px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 18px 44px rgba(133,119,248,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}
.btn-create:hover{transform:translateY(-3px);box-shadow:0 22px 54px rgba(133,119,248,.42);}
.btn-create:active{transform:translateY(-1px);}
.btn-create .icon-circle{
  width:32px;height:32px;
  border-radius:10px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.btn-create svg{width:17px;height:17px;}

.action-row{display:flex;gap:16px;width:100%;}
.action-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:20px;
  padding:22px 14px;
  flex:1;
  min-width:0;
  height:132px;
  cursor:pointer;
  font-family:inherit;
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.action-card:hover{transform:translateY(-4px);border-color:var(--accent);background:var(--panel2);}
.action-card:active{transform:translateY(-1px);}
.action-card .icon-circle{
  width:44px;height:44px;
  border-radius:14px;
  background:var(--panel3);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  flex-shrink:0;
}
.action-card .icon-circle svg{width:20px;height:20px;}
.action-card span{font-size:13px;font-weight:600;color:var(--text);text-align:center;}

.projects-section{width:100%;max-width:860px;}
.projects-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.projects-head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--text);}
.projects-head span{font-size:12px;color:var(--text-dim2);}

.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}

.project-card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:18px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease;
}
.project-card:hover{transform:translateY(-3px);border-color:var(--accent);}

.project-cover{
  width:72px;
  height:72px;
  border-radius:14px;
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  border:1px solid var(--border-soft);
}
.project-cover img{width:100%;height:100%;object-fit:cover;}
.project-cover.fallback img{width:45%;height:45%;object-fit:contain;opacity:.7;}

.project-info{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.project-name{
  font-size:14px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-right:20px;
}
.project-date{font-size:11px;color:var(--text-dim2);}

.project-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:4px;
}
.tag-bubble{
  font-size:10px;
  font-weight:600;
  padding:3px 8px;
  border-radius:999px;
  background:var(--panel3);
  color:var(--text-dim);
}
.tag-bubble.js{background:rgba(240,219,79,.15);color:#f0db4f;}
.tag-bubble.json{background:rgba(242,162,75,.15);color:#f2a24b;}
.tag-bubble.model{background:rgba(20,184,166,.15);color:var(--model);}
.tag-bubble.other{background:var(--panel3);color:var(--text-dim2);}

.project-actions-btn{
  position:absolute;
  top:12px;
  right:10px;
  width:28px;
  height:28px;
  border-radius:8px;
  background:transparent;
  border:none;
  color:var(--text-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.project-actions-btn:hover{background:var(--panel2);color:var(--text);}
.project-actions-btn svg{width:16px;height:16px;}

.context-menu{
  position:fixed;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:6px;
  min-width:150px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  z-index:100;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.context-menu-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  background:transparent;
  border:none;
  width:100%;
  text-align:left;
  font-family:inherit;
}
.context-menu-item:hover{background:var(--panel3);}
.context-menu-item.danger{color:var(--danger);}
.context-menu-item svg{width:15px;height:15px;color:var(--text-dim);flex-shrink:0;}
.context-menu-item.danger svg{color:var(--danger);}

.fmt-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0 20px;
}
.fmt-card{
  background:var(--panel2);
  border:1.5px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  transition:border-color .15s ease, background .15s ease;
}
.fmt-card.active{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.fmt-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  overflow:hidden;
  background:var(--panel3);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.fmt-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.fmt-icon svg{
  width:20px;
  height:20px;
  color:var(--accent);
}
.fmt-info{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.fmt-name{
  font-size:13px;
  font-weight:600;
  color:var(--text);
}
.fmt-desc{
  font-size:11px;
  color:var(--text-dim);
}

.empty-projects{
  width:100%;
  border:1px dashed var(--border-soft);
  border-radius:18px;
  padding:34px 20px;
  text-align:center;
  color:var(--text-dim2);
  font-size:13px;
}

.overlay{
  position:fixed;inset:0;
  background:rgba(8,8,10,.62);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  z-index:120;
  padding:30px;
}
.modal{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:28px;
  width:400px;
  max-width:90vw;
  box-shadow:0 30px 70px rgba(0,0,0,.55);
}
.modal-wide{width:480px;max-height:80vh;display:flex;flex-direction:column;}
.modal h3{margin:0 0 8px;font-size:16px;font-weight:600;}
.modal p{margin:0 0 14px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.modal input{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  color:var(--text);
  font-size:13px;
  outline:none;
  margin-bottom:16px;
  font-family:inherit;
  transition:border-color .15s ease;
}
.modal input:focus{border-color:var(--accent);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.btn{
  padding:10px 18px;
  border-radius:var(--radius-sm);
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:opacity .15s ease,transform .1s ease;
}
.btn:active{transform:scale(.97);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--panel2);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;display:flex;align-items:center;gap:8px;}
.btn-primary:hover{opacity:.9;}
.btn-primary svg{width:15px;height:15px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}

.warn-icon{
  width:54px;height:54px;
  border-radius:50%;
  color:var(--danger);
  background:var(--danger-soft);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.warn-icon svg{width:26px;height:26px;}
.info-icon{
  width:54px;height:54px;
  border-radius:50%;
  color:var(--accent);
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.info-icon svg{width:26px;height:26px;}

.progress-file{font-size:13px;color:var(--text);font-weight:600;margin-bottom:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.progress-track{width:100%;height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:999px;transition:width .25s ease;}
.progress-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--text-dim);}

.guide-list{margin:0 0 4px;padding-left:18px;color:var(--text-dim);font-size:13px;line-height:1.9;}
.guide-list b{color:var(--text);}

.result-header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.result-header .icon-circle{
  width:42px;height:42px;border-radius:13px;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.result-header .icon-circle svg{width:19px;height:19px;}
.result-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-sub{font-size:12px;color:var(--text-dim);margin:2px 0 16px;}

.result-tree{
  flex:1;
  overflow-y:auto;
  margin:0 -8px;
  padding:0 8px;
}
.result-tree::-webkit-scrollbar{width:8px;}
.result-tree::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}

.rnode-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 9px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-size:13px;
  color:var(--text-dim);
  transition:background .12s ease;
}
.rnode-row:hover{background:var(--panel2);color:var(--text);}
.rchevron{width:13px;height:13px;flex-shrink:0;color:var(--text-dim2);transition:transform .18s ease;}
.rnode.open>.rnode-row .rchevron{transform:rotate(90deg);}
.rchevron.hidden{visibility:hidden;}
.rnode-icon{width:17px;height:17px;flex-shrink:0;color:#8577f8;display:flex;align-items:center;justify-content:center;}
.file-badge{
  width:18px;height:18px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:7.5px;font-weight:800;letter-spacing:-.02em;flex-shrink:0;
}
.file-badge svg{width:11px;height:11px;}
.thumb{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-soft);}
.rnode-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rnode-count{
  font-size:10px;font-weight:600;color:var(--text-dim);
  background:var(--panel3);padding:2px 7px;border-radius:999px;flex-shrink:0;
}
.rchildren-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;}
.rnode.open>.rchildren-wrap{grid-template-rows:1fr;}
.rchildren-inner{overflow:hidden;min-height:0;}
.rchildren{padding-left:15px;margin-top:2px;position:relative;}
.rchildren::before{content:'';position:absolute;left:15px;top:2px;bottom:8px;width:1px;background:var(--border-soft);}

.wizard-overlay .modal{
  width:560px;
  max-width:94vw;
  padding:0;
  display:flex;
  flex-direction:column;
  max-height:88vh;
}
.wizard-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;
}
.wizard-header h3{margin:0;font-size:15.5px;}
.wizard-close{
  width:30px;height:30px;border-radius:99px;border:none;background:transparent;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.wizard-close:hover{background:var(--panel2);color:var(--text);}
.wizard-close svg{width:16px;height:16px;}

.wizard-scroll{
  overflow-y:auto;
  padding:22px 24px;
  flex:1;
}
.wizard-scroll::-webkit-scrollbar{width:8px;}
.wizard-scroll::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}

.wizard-footer{
  display:flex;justify-content:flex-end;gap:8px;
  padding:16px 24px;
  border-top:1px solid var(--border-soft);
  flex-shrink:0;
}

.section-title{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim2);margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pack-card{
  grid-column:1/-1;
  background:var(--panel2);
  border:1.5px solid var(--border-soft);
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.pack-card.half{grid-column:span 1;}
.pack-card.active{border-color:var(--accent);background:rgba(133,119,248,.08);}
.pack-card-top{display:flex;align-items:flex-start;gap:12px;}
.pack-card .icon-circle{
  width:36px;height:36px;border-radius:11px;
  background:var(--panel3);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);flex-shrink:0;
}
.pack-card .icon-circle svg{width:17px;height:17px;}
.pack-card-title{font-size:14px;font-weight:600;color:var(--text);}
.status-toggle{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.status-toggle svg{width:15px;height:15px;flex-shrink:0;}
.status-toggle.on{color:var(--ok);}
.pack-desc{font-size:12px;color:var(--text-dim);line-height:1.55;margin:10px 0 0;}
.dep-row{
  display:flex;align-items:center;gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border-soft);
}
.dep-row span{font-size:12px;color:var(--text-dim);line-height:1.4;}

.pill-switch{
  width:38px;height:22px;border-radius:999px;
  background:var(--panel3);
  position:relative;flex-shrink:0;cursor:pointer;
  transition:background .15s ease;
}
.pill-switch.on{background:var(--accent);}
.pill-switch::after{
  content:'';
  position:absolute;top:2.5px;left:2.5px;
  width:17px;height:17px;border-radius:50%;
  background:#e8e8ea;
  transition:transform .15s ease;
}
.pill-switch.on::after{transform:translateX(16px);background:#fff;}

.collapse-box{border:1px solid var(--border-soft);border-radius:16px;overflow:hidden;}
.collapse-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  cursor:pointer;
  background:var(--panel2);
  font-size:13px;font-weight:600;color:var(--text);
}
.collapse-head svg{width:15px;height:15px;color:var(--text-dim);transition:transform .18s ease;}
.collapse-box.open .collapse-head svg{transform:rotate(180deg);}
.collapse-body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;}
.collapse-box.open .collapse-body-wrap{grid-template-rows:1fr;}
.collapse-body-inner{overflow:hidden;min-height:0;}
.collapse-body{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.mini-card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:13px;
  padding:12px;
  cursor:pointer;
  transition:border-color .15s ease;
}
.mini-card.active{border-color:var(--accent);}
.mini-card-top{display:flex;align-items:center;gap:8px;}
.mini-card .icon-circle{
  width:26px;height:26px;border-radius:8px;
  background:var(--panel3);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mini-card .icon-circle svg{width:13px;height:13px;}
.mini-card-title{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;}
.mini-card-tag{font-size:10px;color:var(--text-dim2);margin-top:2px;}
.mini-status{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--text-dim);}
.mini-status svg{width:12px;height:12px;}
.mini-status.on{color:var(--ok);}
.mini-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:6px;}

.form-row{display:flex;gap:12px;margin-top:12px;}
.form-row:first-of-type{margin-top:0;}
.form-col{flex:1;min-width:0;}
.form-col label{display:block;font-size:11px;font-weight:600;color:var(--text-dim2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.form-col input, .form-col select, .form-col textarea{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  color:var(--text);
  font-size:13px;
  outline:none;
  font-family:inherit;
  transition:border-color .15s ease;
}
.form-col input:focus, .form-col select:focus, .form-col textarea:focus{border-color:var(--accent);}
.form-col textarea{resize:vertical;min-height:64px;}

.cover-row{display:flex;gap:12px;align-items:flex-start;}
.cover-picker{
  width:78px;height:78px;
  border-radius:16px;
  border:1px dashed var(--border-soft);
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  overflow:hidden;
  flex-shrink:0;
  color:var(--text-dim2);
  transition:border-color .15s ease;
}
.cover-picker:hover{border-color:var(--accent);color:var(--accent);}
.cover-picker img{width:100%;height:100%;object-fit:cover;}
.cover-picker svg{width:24px;height:24px;}

.toggle-line{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
  padding:12px 0;
  border-top:1px solid var(--border-soft);
}
.toggle-line span{font-size:12.5px;color:var(--text-dim);line-height:1.5;}

@media (max-width: 600px) {
  .home-wrap{padding:80px 16px 40px;gap:32px;}
  .action-row{flex-direction:row;gap:10px;}

const IMAGE_EXTS = ['png','jpg','jpeg','gif','webp','svg','bmp','ico'];
const MODEL_EXTS = ['obj','fbx','glb','gltf','bbmodel'];
const TEXT_EXTS = ['json','js','mjs','cjs','ts','tsx','jsx','md','txt','css','html','htm','yml','yaml','lang','mcfunction','xml','cfg','ini','sh'];
const MC_VERSIONS = ['1.20.80','1.20.90','1.21.0','1.21.20','1.21.40','1.21.60','1.21.80'];

const INDEX_KEY = 'devstudio_projects_index';
const PROJECT_PREFIX = 'devstudio_project_';
let activeContextMenu = null;

function getExt(name){
  return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
}

function isModelFile(path, name){
  const ext = getExt(name);
  if (MODEL_EXTS.includes(ext)) return true;
  if (ext === 'json' && /(^|\/)models(\/|$)/i.test(path)) return true;
  return false;
}

function genId(){ return 'n' + Math.random().toString(36).slice(2, 10); }

function genUUID(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function getProjectsIndex(){
  try { return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]'); } catch(e){ return []; }
}

function saveProjectsIndex(list){
  localStorage.setItem(INDEX_KEY, JSON.stringify(list));
}

function registerProject(id, name, cover){
  const list = getProjectsIndex().filter(p => p.id !== id);
  list.unshift({ id, name, cover: cover || null, updatedAt: Date.now() });
  saveProjectsIndex(list);
}

function saveProjectData(id, name, root){
  localStorage.setItem(PROJECT_PREFIX + id, JSON.stringify({ id, name, root }));
}

function getProjectData(id){
  try {
    const raw = localStorage.getItem(PROJECT_PREFIX + id);
    return raw ? JSON.parse(raw) : null;
  } catch(e) {
    return null;
  }
}

function removeProject(id){
  const list = getProjectsIndex().filter(p => p.id !== id);
  saveProjectsIndex(list);
  localStorage.removeItem(PROJECT_PREFIX + id);
}

function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.remove();
}

function showModal(html, mountFn, extraClass){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'overlay' + (extraClass ? ' ' + extraClass : '');
  overlay.id = 'modalOverlay';
  overlay.innerHTML = html;
  overlay.addEventListener('mousedown', (e) => {
    if (e.target === overlay) closeModal();
  });
  document.body.appendChild(overlay);
  if (mountFn) mountFn(overlay);
}

function formatDate(ts){
  try { return new Date(ts).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }); }
  catch(e){ return ''; }
}

function scanProjectTags(rootNode){
  let hasJs = false;
  let hasJson = false;
  let hasModel = false;
  let hasOther = false;

  function traverse(node){
    if(!node) return;
    if(node.type === 'file'){
      const ext = getExt(node.name);
      if(node.isModel || MODEL_EXTS.includes(ext)){
        hasModel = true;
      } else if(['js','mjs','cjs','ts','tsx','jsx'].includes(ext)){
        hasJs = true;
      } else if(ext === 'json'){
        hasJson = true;
      } else {
        hasOther = true;
      }
    }
    if(node.children && Array.isArray(node.children)){
      node.children.forEach(traverse);
    }
  }

  traverse(rootNode);

  const tags = [];
  if(hasJs) tags.push({ label: 'JS', cls: 'js' });
  if(hasJson) tags.push({ label: 'Json', cls: 'json' });
  if(hasModel) tags.push({ label: 'Modelos', cls: 'model' });
  if(hasOther || tags.length === 0) tags.push({ label: 'Otros', cls: 'other' });

  return tags;
}

function closeContextMenu(){
  if(activeContextMenu){
    activeContextMenu.remove();
    activeContextMenu = null;
  }
}

document.addEventListener('click', () => closeContextMenu());

function renderProjects(){
  const list = getProjectsIndex().sort((a, b) => b.updatedAt - a.updatedAt);
  const area = document.getElementById('projectsArea');
  const countEl = document.getElementById('projectsCount');
  countEl.textContent = list.length ? (list.length + (list.length === 1 ? ' proyecto' : ' proyectos')) : '';

  if (!list.length){
    area.innerHTML = `<div class="empty-projects">Todavía no tienes proyectos guardados. Crea uno nuevo o sube un complemento para empezar.</div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'projects-grid';
  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    
    const projectData = getProjectData(p.id);
    let tags = [{ label: 'Otros', cls: 'other' }];
    if (projectData && projectData.root) {
      tags = scanProjectTags(projectData.root);
    }

    const coverHtml = p.cover
      ? `<div class="project-cover"><img src="${p.cover}" alt="${p.name}"></div>`
      : `<div class="project-cover fallback"><img src="img/logo.jpg" alt="${p.name}"></div>`;
    
    const tagsHtml = tags.map(t => `<span class="tag-bubble ${t.cls}">${t.label}</span>`).join('');

    card.innerHTML = `
      ${coverHtml}
      <div class="project-info">
        <div class="project-name" title="${p.name}">${p.name}</div>
        <div class="project-date">${formatDate(p.updatedAt)}</div>
        <div class="project-tags">${tagsHtml}</div>
      </div>
      <button class="project-actions-btn" aria-label="Opciones">${ICONS.dots}</button>
    `;

    card.addEventListener('click', (e) => {
      if(e.target.closest('.project-actions-btn')) return;
      window.location.href = 'ed/co?id=' + p.id;
    });

    const dotsBtn = card.querySelector('.project-actions-btn');
    dotsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeContextMenu();

      const menu = document.createElement('div');
      menu.className = 'context-menu';
      menu.innerHTML = `
        <button class="context-menu-item" id="optRename">${ICONS.edit}<span>Renombrar</span></button>
        <button class="context-menu-item" id="optDownload">${ICONS.download}<span>Descargar</span></button>
        <button class="context-menu-item danger" id="optDelete">${ICONS.trash}<span>Eliminar</span></button>
      `;

      const rect = dotsBtn.getBoundingClientRect();
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - 160) + 'px';

      document.body.appendChild(menu);
      activeContextMenu = menu;

      menu.querySelector('#optRename').addEventListener('click', (ev) => {
        ev.stopPropagation();
        closeContextMenu();
        showRenameModal(p);
      });

      menu.querySelector('#optDownload').addEventListener('click', (ev) => {
        ev.stopPropagation();
        closeContextMenu();
        showDownloadModal(p);
      });

      menu.querySelector('#optDelete').addEventListener('click', (ev) => {
        ev.stopPropagation();
        closeContextMenu();
        showDeleteModal(p);
      });
    });

    grid.appendChild(card);
  });
  area.innerHTML = '';
  area.appendChild(grid);
}

function showRenameModal(p){
  showModal(`
    <div class="modal">
      <h3>Renombrar Proyecto</h3>
      <p>Introduce un nuevo nombre para tu proyecto.</p>
      <input type="text" id="renameInput" value="${p.name}">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="renameCancel">Cancelar</button>
        <button class="btn btn-primary" id="renameConfirm">Guardar</button>
      </div>
    </div>
  `, (overlay) => {
    const input = overlay.querySelector('#renameInput');
    input.focus();
    input.select();
    overlay.querySelector('#renameCancel').onclick = closeModal;
    overlay.querySelector('#renameConfirm').onclick = () => {
      const newName = input.value.trim();
      if(newName){
        registerProject(p.id, newName, p.cover);
        const data = getProjectData(p.id);
        if(data){
          saveProjectData(p.id, newName, data.root);
        }
        renderProjects();
        closeModal();
      }
    };
  });
}

function showDeleteModal(p){
  showModal(`
    <div class="modal">
      <div class="warn-icon">${ICONS.warn}</div>
      <h3>¿Eliminar proyecto?</h3>
      <p>Estás a punto de eliminar <b>"${p.name}"</b>. Esta acción no se puede deshacer y perderás todos los archivos.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="delCancel">Cancelar</button>
        <button class="btn btn-danger" id="delConfirm">Eliminar</button>
      </div>
    </div>
  `, (overlay) => {
    overlay.querySelector('#delCancel').onclick = closeModal;
    overlay.querySelector('#delConfirm').onclick = () => {
      removeProject(p.id);
      renderProjects();
      closeModal();
    };
  });
}

function zipAddFolder(zip, node){
  if (!node.children) return;
  node.children.forEach(child => {
    if (child.type === 'folder'){
      const sub = zip.folder(child.name);
      zipAddFolder(sub, child);
    } else {
      let data = child.content || '';
      if (typeof data === 'string' && data.startsWith('data:')){
        const base64Str = data.split(',')[1] || '';
        zip.file(child.name, base64Str, { base64: true });
      } else {
        zip.file(child.name, data);
      }
    }
  });
}

    });

    overlay.querySelector('#dlCancel').onclick = closeModal;
    overlay.querySelector('#dlConfirm').onclick = async () => {
      const btn = overlay.querySelector('#dlConfirm');
      btn.disabled = true;
      btn.textContent = 'Generando...';

      try {
        const zip = new JSZip();
        zipAddFolder(zip, rootNode);
        const blob = await zip.generateAsync({ type: 'blob' });
        const filename = (p.name || 'proyecto').replace(/[^a-z0-9_-]/gi, '_') + '.' + selectedFmt;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
        closeModal();
      } catch(e) {
        btn.disabled = false;
        btn.textContent = 'Descargar';
        showErrorModal('No se pudo generar el archivo de descarga.');
      }
    };
  });
}

function updateProgress(pct, stage){
  const fill = document.getElementById('progressFill');
  const pctEl = document.getElementById('progressPct');
  const stageEl = document.getElementById('progressStage');
  if (!fill) return;
  const clamped = Math.max(0, Math.min(100, pct));
  fill.style.width = clamped + '%';
  pctEl.textContent = Math.round(clamped) + '%';
  if (stage) stageEl.textContent = stage;
}

function readFileWithProgress(file, onProgress){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onprogress = (e) => {
      if (e.lengthComputable) onProgress(e.loaded / e.total);
    };
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

function ensureFolderChain(root, cache, parts){
  let current = root;
  let currentPath = '';
  parts.forEach(part => {
    if (!part) return;
    const nextPath = currentPath ? currentPath + '/' + part : part;
    if (!cache[nextPath]){
      const folderNode = { id: genId(), type: 'folder', name: part, open: false, children: [] };
      current.children.push(folderNode);
      cache[nextPath] = folderNode;
    }
    current = cache[nextPath];
    currentPath = nextPath;
  });
  return current;
}

function findManifestName(node){
  if (node.type === 'file' && node.name.toLowerCase() === 'manifest.json' && node.content){
    try {
      const parsed = JSON.parse(node.content);
      if (parsed.header && parsed.header.name) return parsed.header.name;
    } catch(e){}
  }
  if (node.children){
    for (const child of node.children){
      const found = findManifestName(child);
      if (found) return found;
    }
  }
  return null;
}

function findCoverImage(node){
  if (node.type === 'file' && /^pack_icon\./i.test(node.name) && node.content) return node.content;
  if (node.children){
    for (const child of node.children){
      const found = findCoverImage(child);
      if (found) return found;
    }
  }
  return null;
}

async function processAddon(file){
  showProgressModal(file.name);
  try {
    updateProgress(3, 'Leyendo archivo...');
    const arrayBuffer = await readFileWithProgress(file, (pct) => {
      updateProgress(3 + pct * 37, 'Leyendo archivo...');
    });

    updateProgress(42, 'Analizando complemento...');
    const zip = await JSZip.loadAsync(arrayBuffer);

    updateProgress(52, 'Extrayendo contenido...');
    const extractedRoot = { id: 'root', type: 'folder', name: 'root', open: true, children: [] };
    const cache = { '': extractedRoot };
    const entries = Object.keys(zip.files);
    const total = entries.length || 1;
    let processed = 0;

    for (const relPath of entries){
      const entry = zip.files[relPath];
      const fullParts = relPath.replace(/\/$/, '').split('/').filter(Boolean);

      if (entry.dir){
        ensureFolderChain(extractedRoot, cache, fullParts);
      } else {
        const fileName = fullParts.pop();
        const parentFolder = ensureFolderChain(extractedRoot, cache, fullParts);
        const ext = getExt(fileName);
        let content = '';
        if (IMAGE_EXTS.includes(ext)){
          try {
            const base64 = await entry.async('base64');
            const mime = ext === 'svg' ? 'svg+xml' : ext;
            content = 'data:image/' + mime + ';base64,' + base64;
          } catch(e){
            content = '';
          }
        } else if (TEXT_EXTS.includes(ext)){
          try { content = await entry.async('string'); } catch(e){ content = ''; }
        }
        parentFolder.children.push({
          id: genId(),
          type: 'file',
          name: fileName,
          content,
          isModel: isModelFile(relPath, fileName)
        });
      }

      processed += 1;
      updateProgress(52 + (processed / total) * 46, 'Procesando ' + relPath);
    }

    extractedRoot.children.forEach(child => { if (child.type === 'folder') child.open = true; });

    updateProgress(100, 'Completado');
    await new Promise(r => setTimeout(r, 350));

    const manifestName = findManifestName(extractedRoot);
    const cover = findCoverImage(extractedRoot);
    const displayName = manifestName || file.name.replace(/\.[^.]+$/, '');
    showResultModal(displayName, extractedRoot, cover);
  } catch (e){
    showErrorModal('Asegúrate de que sea un complemento válido (.mcaddon) y vuelve a intentarlo.');
  }
}

function countAll(node){
  let folders = 0, files = 0;
  node.children.forEach(child => {
    if (child.type === 'folder'){
      folders += 1;
      const nested = countAll(child);
      folders += nested.folders;
      files += nested.files;
    } else {
      files += 1;
    }
  });
  return { folders, files };
}

function fileBadgeHtml(node){
  if (node.isModel){
    return `<div class="file-badge" style="background:var(--model);color:#fff">${ICONS.cube}</div>`;
  }
  const ext = getExt(node.name);
  if (IMAGE_EXTS.includes(ext)){
    if (node.content) return `<img class="thumb" src="${node.content}" alt="${node.name}">`;
    return `<div class="file-badge" style="background:#a855f7;color:#fff">${ICONS.image}</div>`;
  }
  if (FILE_TYPES[ext]){
    const meta = FILE_TYPES[ext];
    return `<div class="file-badge" style="background:${meta.bg};color:${meta.color}">${meta.label}</div>`;
  }
  return `<div class="rnode-icon">${ICONS.file}</div>`;
}

function renderResultNode(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'rnode' + (node.type === 'folder' && node.open ? ' open' : '');

  const row = document.createElement('div');
  row.className = 'rnode-row';
  row.style.paddingLeft = (9 + depth * 14) + 'px';

  const chevron = document.createElement('div');
  chevron.className = 'rchevron' + (node.type === 'file' ? ' hidden' : '');
  chevron.innerHTML = ICONS.chevron;
  row.appendChild(chevron);

  let icon = null;
  if (node.type === 'folder'){
    icon = document.createElement('div');
    icon.className = 'rnode-icon';
    icon.innerHTML = node.open ? ICONS.folderOpen : ICONS.folderClosed;
    row.appendChild(icon);
  } else {
    row.insertAdjacentHTML('beforeend', fileBadgeHtml(node));
  }

  const name = document.createElement('div');
  name.className = 'rnode-name';
  name.textContent = node.name;
  row.appendChild(name);

  if (node.type === 'folder'){
    const count = document.createElement('div');
    count.className = 'rnode-count';
    count.textContent = node.children.length;
    row.appendChild(count);
    row.addEventListener('click', () => {
      node.open = !node.open;
      wrap.classList.toggle('open', node.open);
      icon.innerHTML = node.open ? ICONS.folderOpen : ICONS.folderClosed;
    });
  }

  wrap.appendChild(row);

  if (node.type === 'folder'){
    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'rchildren-wrap';
    const inner = document.createElement('div');
    inner.className = 'rchildren-inner';
    const childrenEl = document.createElement('div');
    childrenEl.className = 'rchildren';
    node.children.forEach(child => childrenEl.appendChild(renderResultNode(child, depth + 1)));
    inner.appendChild(childrenEl);
    childrenWrap.appendChild(inner);
    wrap.appendChild(childrenWrap);
  }

  return wrap;
}

function wireWizardEvents(overlay, wiz){

      renderWizardBody(overlay, wiz);
    });
  });

  overlay.querySelectorAll('[data-dep]').forEach(sw => {
    sw.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = sw.getAttribute('data-dep');
      wiz.deps[key] = !wiz.deps[key];
      renderWizardBody(overlay, wiz);
    });
  });

  overlay.querySelectorAll('[data-exp]').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.getAttribute('data-exp');
      wiz.experimental[key] = !wiz.experimental[key];
      renderWizardBody(overlay, wiz);
    });
  });

  overlay.querySelectorAll('[data-file]').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.getAttribute('data-file');
      wiz.files[key] = !wiz.files[key];
      renderWizardBody(overlay, wiz);
    });
  });

  overlay.querySelector('#expHead').addEventListener('click', () => {
    wiz.expOpen = !wiz.expOpen;
    renderWizardBody(overlay, wiz);
  });
  overlay.querySelector('#filesHead').addEventListener('click', () => {
    wiz.filesOpen = !wiz.filesOpen;
    renderWizardBody(overlay, wiz);
  });

  overlay.querySelector('#coverPicker').addEventListener('click', () => {
    const input = document.getElementById('coverInput');
    input.onchange = () => {
      const file = input.files[0];
      if (file){
        const reader = new FileReader();
        reader.onload = () => {
          wiz.cover = reader.result;
          renderWizardBody(overlay, wiz);
        };
        reader.readAsDataURL(file);
      }
      input.value = '';
    };
    input.click();
  });

  overlay.querySelector('#wizName').addEventListener('input', (e) => { wiz.name = e.target.value; });
  overlay.querySelector('#wizDesc').addEventListener('input', (e) => { wiz.description = e.target.value; });
  overlay.querySelector('#wizPrefix').addEventListener('input', (e) => { wiz.prefix = e.target.value; });
  overlay.querySelector('#wizAuthor').addEventListener('input', (e) => { wiz.author = e.target.value; });
  overlay.querySelector('#wizVersion').addEventListener('change', (e) => { wiz.targetVersion = e.target.value; });

  overlay.querySelector('#manifestToggle').addEventListener('click', () => {
    wiz.manifestFlag = !wiz.manifestFlag;
    renderWizardBody(overlay, wiz);
  });
  overlay.querySelector('#dedicatedToggle').addEventListener('click', () => {
    wiz.dedicatedFlag = !wiz.dedicatedFlag;
    renderWizardBody(overlay, wiz);
  });
}

function addFolderNode(parent, name){
  const f = { id: genId(), type:'folder', name, open:true, children:[] };
  parent.children.push(f);
  return f;
}

function addFileNode(parent, name, content){
  parent.children.push({ id: genId(), type:'file', name, content: content || '' });
}

function getOrCreateSubfolder(parent, path){
  if (!path) return parent;
  const segments = path.split('/').filter(Boolean);
  let current = parent;
  segments.forEach(seg => {
    let existing = current.children.find(c => c.type === 'folder' && c.name === seg);
    if (!existing){
      existing = addFolderNode(current, seg);
    }
    current = existing;
  });
  return current;
}

function buildProjectFromWizard(wiz){
  const root = { id:'root', type:'folder', name:'root', open:true, children:[] };
  const targetParts = wiz.targetVersion.split('.').map(n => parseInt(n, 10));
  const bpId = genUUID(), rpId = genUUID(), spId = genUUID(), wtId = genUUID();
  const projectName = wiz.name.trim() || 'New Project';

  let bpFolder = null, rpFolder = null;

  if (wiz.packs.behavior){
    bpFolder = addFolderNode(root, 'BP');
    const manifest = {
      format_version: 2,
      header: { name: wiz.manifestFlag ? projectName : 'pack.name', description: wiz.manifestFlag ? wiz.description : 'pack.description', uuid: bpId, version:[1,0,0], min_engine_version: targetParts },
      modules: [{ type:'data', uuid: genUUID(), version:[1,0,0] }]
    };
    if (wiz.deps.bpDependsRp && wiz.packs.resource) manifest.dependencies = [{ uuid: rpId, version:[1,0,0] }];
    addFileNode(bpFolder, 'manifest.json', JSON.stringify(manifest, null, 2));
    if (wiz.cover) addFileNode(bpFolder, 'pack_icon.png', wiz.cover);
    addFolderNode(bpFolder, 'scripts');
  }

  if (wiz.packs.resource){
    rpFolder = addFolderNode(root, 'RP');
    const manifest = {
      format_version: 2,
      header: { name: wiz.manifestFlag ? projectName : 'pack.name', description: wiz.manifestFlag ? wiz.description : 'pack.description', uuid: rpId, version:[1,0,0], min_engine_version: targetParts },
      modules: [{ type:'resources', uuid: genUUID(), version:[1,0,0] }]
    };
    if (wiz.deps.rpDependsBp && wiz.packs.behavior) manifest.dependencies = [{ uuid: bpId, version:[1,0,0] }];
    addFileNode(rpFolder, 'manifest.json', JSON.stringify(manifest, null, 2));
    if (wiz.cover) addFileNode(rpFolder, 'pack_icon.png', wiz.cover);
    addFolderNode(rpFolder, 'textures');
  }

  if (wiz.packs.skin){
    const spFolder = addFolderNode(root, 'SP');
    const manifest = {
      format_version: 2,
      header: { name: wiz.manifestFlag ? projectName : 'pack.name', description: wiz.manifestFlag ? wiz.description : 'pack.description', uuid: spId, version:[1,0,0] },
      modules: [{ type:'skin_pack', uuid: genUUID(), version:[1,0,0] }]
    };
    addFileNode(spFolder, 'manifest.json', JSON.stringify(manifest, null, 2));
    addFileNode(spFolder, 'skins.json', JSON.stringify({ serialize_name: wiz.prefix || 'skins', geometry:'geometry.humanoid.custom', skins:[] }, null, 2));
    if (wiz.cover) addFileNode(spFolder, 'pack_icon.png', wiz.cover);
  }

  if (wiz.packs.world){
    const wtFolder = addFolderNode(root, 'World');
    const manifest = {
      format_version: 2,
      header: { name: wiz.manifestFlag ? projectName : 'pack.name', description: wiz.manifestFlag ? wiz.description : 'pack.description', uuid: wtId, version:[1,0,0] },
      modules: [{ type:'world_template', uuid: genUUID(), version:[1,0,0] }]
    };
    addFileNode(wtFolder, 'manifest.json', JSON.stringify(manifest, null, 2));
    if (wiz.cover) addFileNode(wtFolder, 'world_icon.png', wiz.cover);
  }

  INDIVIDUAL_FILES_DEFS.forEach(def => {
    if (!wiz.files[def.key]) return;
    const base = def.target === 'bp' ? bpFolder : rpFolder;
    if (!base) return;
    const target = getOrCreateSubfolder(base, def.folder);
    addFileNode(target, def.name, JSON.stringify(def.content, null, 2));
  });

  addFileNode(root, 'README.md',
`# ${projectName}

Autor: ${wiz.author || 'MatCat'}
Versión objetivo: ${wiz.targetVersion}
${wiz.dedicatedFlag ? 'Configurado para Bedrock Dedicated Servers.\n' : ''}
Proyecto generado con ComDex.
`);

  return root;
}

function submitWizard(wiz){
  wiz.name = (wiz.name || '').trim() || 'New Project';
  const root = buildProjectFromWizard(wiz);
  const id = genId();
  saveProjectData(id, wiz.name, root);
  registerProject(id, wiz.name, wiz.cover);
  window.location.href = 'ed/co?id=' + id;
}

const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initParticles(){
  const count = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 24000));
  particles = [];
  for (let i = 0; i < count; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.6,
      vx: (Math.random() - 0.5) * 0.12,
      vy: (Math.random() - 0.5) * 0.12,
      o: Math.random() * 0.3 + 0.06
    });
  }
}

function tickParticles(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(133,119,248,' + p.o + ')';
    ctx.fill();
  });
  requestAnimationFrame(tickParticles);
}

window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
resizeCanvas();
initParticles();
tickParticles();
renderProjects();
</script>
