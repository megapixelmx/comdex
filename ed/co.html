<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComDex · Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="icon" type="image/jpeg" href="../img/logo.jpg">
<style>
:root{
  --bg:#17171a;
  --panel:#1d1d21;
  --panel2:#26262b;
  --panel3:#2f2f35;
  --border:#323238;
  --border-soft:#2a2a30;
  --text:#edeef0;
  --text-dim:#93939a;
  --text-dim2:#6d6d74;
  --accent:#8577f8;
  --accent-strong:#7263f2;
  --accent-soft:rgba(133,119,248,.15);
  --danger:#f2495c;
  --danger-soft:rgba(242,73,92,.14);
  --model:#14b8a6;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:11px;
  --radius-pill:999px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;height:100vh;width:100vw;position:relative;}

.rail{
  width:66px;
  background:var(--panel);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 0;
  gap:8px;
  flex-shrink:0;
  z-index:30;
}
.rail-logo{
  width:38px;height:38px;
  border-radius:var(--radius-sm);
  overflow:hidden;
  margin-bottom:18px;
  background:var(--panel3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.rail-logo img{width:100%;height:100%;object-fit:cover;}
.rail-btn{
  position:relative;
  width:44px;height:44px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);
  cursor:pointer;
  transition:background .15s ease,color .15s ease,transform .1s ease;
  text-decoration:none;
}
.rail-btn:hover{background:var(--panel3);color:var(--text);}
.rail-btn:active{transform:scale(.94);}
.rail-btn.active{background:var(--accent-soft);color:var(--accent);}
.rail-btn svg{width:20px;height:20px;}
.rail-btn[data-tooltip]::after{
  content:attr(data-tooltip);
  position:absolute;
  left:calc(100% + 12px);
  top:50%;
  transform:translateY(-50%) translateX(-4px);
  background:var(--panel3);
  color:var(--text);
  padding:6px 11px;
  border-radius:var(--radius-sm);
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
  z-index:200;
}
.rail-btn[data-tooltip]:hover::after{opacity:1;transform:translateY(-50%) translateX(0);}
.rail-spacer{flex:1;}

.sidebar{
  width:308px;
  background:var(--panel);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  z-index:20;
  transition:transform .25s ease;
}
.sidebar-header{
  padding:20px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.project-name{
  font-size:15px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:178px;
  letter-spacing:-.01em;
}
.header-actions{display:flex;align-items:center;gap:5px;}
.icon-btn{
  width:33px;height:33px;
  border-radius:var(--radius-sm);
  border:none;
  background:transparent;
  color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,transform .1s ease;
}
.icon-btn:hover{background:var(--panel3);color:var(--text);}
.icon-btn:active{transform:scale(.92);}
.icon-btn svg{width:17px;height:17px;}

.search-wrap{padding:0 18px 16px;}
.search-box{
  display:flex;align-items:center;gap:9px;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-pill);
  padding:10px 15px;
  transition:border-color .15s ease,background .15s ease;
}
.search-box:focus-within{border-color:var(--accent);background:var(--panel3);}
.search-box svg{width:15px;height:15px;color:var(--text-dim2);flex-shrink:0;}
.search-box input{
  background:transparent;border:none;outline:none;
  color:var(--text);font-size:13px;width:100%;
  font-family:inherit;
}
.search-box input::placeholder{color:var(--text-dim2);}

.tree-label{
  padding:2px 22px 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-dim2);
}

.tree{
  flex:1;
  overflow-y:auto;
  padding:0 12px 20px;
}
.tree::-webkit-scrollbar{width:8px;}
.tree::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}

.node{position:relative;}
.node-row{
  display:flex;align-items:center;gap:7px;
  padding:8px 9px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-size:13px;
  color:var(--text);
  user-select:none;
  position:relative;
  transition:background .12s ease;
}
.node-row:hover{background:var(--panel2);}
.node-row.selected{
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px rgba(133,119,248,.35);
}
.node-row.selected .node-name{color:var(--text);font-weight:500;}
.chevron{
  width:14px;height:14px;flex-shrink:0;
  color:var(--text-dim2);
  transition:transform .18s ease;
}
.node.open>.node-row .chevron{transform:rotate(90deg);color:var(--text-dim);}
.chevron.hidden{visibility:hidden;}
.node-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.node-icon.folder{color:#8577f8;}
.node-icon.file{color:#6d6d74;}
.file-badge{
  width:18px;height:18px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:7.5px;
  font-weight:800;
  letter-spacing:-.02em;
  flex-shrink:0;
}
.file-badge svg{width:11px;height:11px;}
.node-thumb{
  width:20px;height:20px;
  border-radius:6px;
  object-fit:cover;
  flex-shrink:0;
  border:1px solid var(--border-soft);
}
.node-name{
  flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-dim);
}
.node-row:hover .node-name{color:var(--text);}
.node-name-input{
  flex:1;background:var(--bg);border:1px solid var(--accent);
  border-radius:7px;color:var(--text);font-size:13px;
  padding:3px 7px;outline:none;font-family:inherit;
}
.node-count{
  font-size:10.5px;
  font-weight:600;
  color:var(--text-dim);
  background:var(--panel3);
  padding:2px 8px;
  border-radius:var(--radius-pill);
  flex-shrink:0;
}
.node-plus{
  width:23px;height:23px;
  border-radius:8px;
  display:none;
  align-items:center;justify-content:center;
  color:var(--text-dim);
  flex-shrink:0;
}
.node-row.selected .node-plus{display:flex;}
.node-plus:hover{background:var(--panel3);color:var(--text);}
.node-plus svg{width:14px;height:14px;}

.node-children-wrap{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .2s ease;
}
.node.open>.node-children-wrap{grid-template-rows:1fr;}
.node-children-inner{overflow:hidden;min-height:0;}
.children{
  padding-left:15px;
  margin-top:2px;
  position:relative;
}
.children::before{
  content:'';
  position:absolute;
  left:15px;top:2px;bottom:8px;
  width:1px;
  background:var(--border-soft);
}

.editor{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  min-width:0;
  position:relative;
}
.editor-header{
  padding:15px 24px;
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  flex-shrink:0;
}
.editor-title{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.editor-title b{color:var(--text);font-weight:600;}
.editor-title .lang-pill{
  font-size:10.5px;
  font-weight:700;
  color:var(--text-dim);
  background:var(--panel2);
  border:1px solid var(--border-soft);
  padding:2px 9px;
  border-radius:var(--radius-pill);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.header-btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.save-btn{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius-sm);
  padding:9px 18px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s ease,transform .1s ease;
}
.save-btn:hover{opacity:.9;}
.save-btn:active{transform:scale(.97);}
.ghost-btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:var(--panel2);
  color:var(--text-dim);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:9px 16px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  font-family:inherit;
}
.ghost-btn:hover{color:var(--text);background:var(--panel3);}
.ghost-btn svg{width:14px;height:14px;flex-shrink:0;}
.ghost-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

.code-wrap{position:relative;flex:1;overflow:hidden;display:flex;}
.line-numbers{
  width:48px;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
  padding:22px 0;
  border-right:1px solid var(--border-soft);
  background:var(--panel);
}
.line-numbers-inner{position:relative;}
.line-numbers-inner div{
  font-family:'SFMono-Regular',Consolas,'Fira Code',monospace;
  font-size:13px;
  line-height:1.7;
  color:var(--text-dim2);
  text-align:right;
  padding-right:12px;
  white-space:nowrap;
}
.code-scroll{position:relative;flex:1;overflow:hidden;min-width:0;}
.code-highlight, .code-area{
  position:absolute;
  inset:0;
  margin:0;
  padding:22px 26px;
  font-family:'SFMono-Regular',Consolas,'Fira Code',monospace;
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
  word-wrap:break-word;
  box-sizing:border-box;
}
.code-highlight{
  overflow:auto;
  pointer-events:none;
  background:transparent;
  color:#c9d1d9;
}
.code-highlight code{
  background:transparent !important;
  padding:0 !important;
  font-family:inherit;
  font-size:inherit;
  line-height:inherit;
  white-space:pre-wrap;
  word-wrap:break-word;
}
.code-area{
  background:transparent;
  color:transparent;
  caret-color:#fff;
  border:none;
  outline:none;
  resize:none;
  overflow:auto;
  z-index:2;
  -webkit-text-fill-color:transparent;
}

.image-preview-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:40px;
  background-image:
    linear-gradient(45deg,rgba(255,255,255,.02) 25%,transparent 25%),
    linear-gradient(-45deg,rgba(255,255,255,.02) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,rgba(255,255,255,.02) 75%),
    linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.02) 75%);
  background-size:24px 24px;
  background-position:0 0,0 12px,12px -12px,-12px 0;
}
.image-preview-wrap img{
  max-width:100%;
  max-height:64vh;
  border-radius:var(--radius-md);
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  border:1px solid var(--border-soft);
}
.image-preview-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  color:var(--text-dim2);
}
.image-preview-empty svg{width:54px;height:54px;color:var(--panel3);}
.image-preview-empty p{margin:0;font-size:13px;text-align:center;max-width:260px;line-height:1.5;}

.empty-state{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  color:var(--text-dim2);
}
.empty-state svg{width:56px;height:56px;color:var(--panel3);}
.empty-state p{margin:0;font-size:13px;}

.menu{
  position:fixed;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:7px;
  min-width:206px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);
  z-index:80;
}
.menu-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;
  border-radius:var(--radius-sm);
  font-size:13px;
  cursor:pointer;
  color:var(--text);
}
.menu-item svg{width:15px;height:15px;color:var(--text-dim);flex-shrink:0;}
.menu-item:hover{background:var(--panel3);}
.menu-item.danger{color:var(--danger);}
.menu-item.danger svg{color:var(--danger);}
.menu-sep{height:1px;background:var(--border-soft);margin:6px 5px;}

.overlay{
  position:fixed;inset:0;
  background:rgba(8,8,10,.62);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  z-index:120;
}
.modal{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:28px;
  width:390px;
  max-width:90vw;
  box-shadow:0 30px 70px rgba(0,0,0,.55);
}
.modal h3{margin:0 0 8px;font-size:16px;font-weight:600;}
.modal p{margin:0 0 18px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.modal input{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  color:var(--text);
  font-size:13px;
  outline:none;
  margin-bottom:16px;
  font-family:inherit;
  transition:border-color .15s ease;
}
.modal input:focus{border-color:var(--accent);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.btn{
  padding:10px 18px;
  border-radius:var(--radius-sm);
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:opacity .15s ease,transform .1s ease;
}
.btn:active{transform:scale(.97);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--panel2);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

.warn-icon{
  width:54px;height:54px;
  border-radius:50%;
  background:var(--danger-soft);
  color:var(--danger);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.warn-icon svg{width:26px;height:26px;}
.folder-pick{
  max-height:210px;
  overflow-y:auto;
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  margin-bottom:16px;
}
.folder-pick-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 13px;
  font-size:13px;
  cursor:pointer;
  border-bottom:1px solid var(--border-soft);
  color:var(--text-dim);
}
.folder-pick-item:last-child{border-bottom:none;}
.folder-pick-item:hover{background:var(--panel2);color:var(--text);}
.folder-pick-item.active{background:var(--accent-soft);color:var(--accent);}
.folder-pick-item svg{width:15px;height:15px;color:#8577f8;flex-shrink:0;}

.fmt-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0 20px;
}
.fmt-card{
  background:var(--panel2);
  border:1.5px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  transition:border-color .15s ease, background .15s ease;
}
.fmt-card.active{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.fmt-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  overflow:hidden;
  background:var(--panel3);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.fmt-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.fmt-icon svg{
  width:20px;
  height:20px;
  color:var(--accent);
}
.fmt-info{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.fmt-name{
  font-size:13px;
  font-weight:600;
  color:var(--text);
}
.fmt-desc{
  font-size:11px;
  color:var(--text-dim);
}

.structure-panel{
  position:absolute;
  top:64px;
  right:16px;
  width:260px;
  max-height:60vh;
  overflow-y:auto;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  box-shadow:0 18px 40px rgba(0,0,0,.5);
  padding:16px;
  z-index:50;
  display:none;
}
.structure-panel.open{display:block;}
.structure-panel::-webkit-scrollbar{width:7px;}
.structure-panel::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}
.structure-section{margin-bottom:14px;}
.structure-section:last-child{margin-bottom:0;}
.structure-section h4{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim2);}
.structure-chip-list{display:flex;flex-wrap:wrap;gap:6px;}
.structure-chip{
  font-size:11.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:var(--panel3);
  color:var(--text-dim);
  font-family:'SFMono-Regular',Consolas,'Fira Code',monospace;
}
.structure-chip.var{background:rgba(133,119,248,.15);color:var(--accent);}
.structure-chip.tag{background:rgba(227,76,38,.15);color:#e37a4c;}
.structure-chip.syn{background:rgba(20,184,166,.15);color:var(--model);}
.structure-empty{font-size:12px;color:var(--text-dim2);}

.autocomplete-box{
  position:fixed;
  z-index:300;
  background:var(--panel2);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  box-shadow:0 14px 34px rgba(0,0,0,.5);
  max-height:220px;
  overflow-y:auto;
  min-width:140px;
  max-width:280px;
  padding:4px;
}
.autocomplete-box::-webkit-scrollbar{width:6px;}
.autocomplete-box::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}
.ac-item{
  padding:7px 10px;
  font-size:12.5px;
  font-family:'SFMono-Regular',Consolas,'Fira Code',monospace;
  color:var(--text-dim);
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ac-item.active, .ac-item:hover{background:var(--accent-soft);color:var(--text);}

.pill-switch{
  width:38px;height:22px;border-radius:999px;
  background:var(--panel3);
  position:relative;flex-shrink:0;cursor:pointer;
  transition:background .15s ease;
}
.pill-switch.on{background:var(--accent);}
.pill-switch::after{
  content:'';
  position:absolute;top:2.5px;left:2.5px;
  width:17px;height:17px;border-radius:50%;
  background:#e8e8ea;
  transition:transform .15s ease;
}
.pill-switch.on::after{transform:translateX(16px);background:#fff;}
.toggle-line{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
  padding:12px 0;
  border-top:1px solid var(--border-soft);
}
.toggle-line:first-of-type{border-top:none;padding-top:2px;}
.toggle-line span{font-size:12.5px;color:var(--text-dim);line-height:1.5;}

.mobile-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(2px);
  z-index:15;
}

@media (max-width:768px){
  .sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:66px;
    width:min(308px,calc(100vw - 66px));
    transform:translateX(-100%);
    box-shadow:4px 0 16px rgba(0,0,0,.4);
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .mobile-overlay.open{
    display:block;
  }
  .editor-header{
    padding:12px 16px;

const SETTINGS_KEY = 'devstudio_editor_settings';

function loadEditorSettings(){
  try {
    return Object.assign({ autocomplete: true, structure: true, lineNumbers: true }, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'));
  } catch(e){
    return { autocomplete: true, structure: true, lineNumbers: true };

}

let editorSettings = loadEditorSettings();

function analyzeCode(code, lang){
  const variables = new Set();
  const tags = new Set();
  const syntax = new Set();

  const varRegex = /\b(?:let|const|var)\s+([A-Za-z_$][\w$]*)/g;
  const fnRegex = /\bfunction\s+([A-Za-z_$][\w$]*)/g;
  const arrowRegex = /\b([A-Za-z_$][\w$]*)\s*=\s*(?:\([^)]*\)|[A-Za-z_$][\w$]*)\s*=>/g;
  let m;
  while ((m = varRegex.exec(code))) variables.add(m[1]);
  while ((m = fnRegex.exec(code))) variables.add(m[1]);
  while ((m = arrowRegex.exec(code))) variables.add(m[1]);

  if (lang === 'json'){
    const keyRegex = /"([A-Za-z_$][\w$]*)"\s*:/g;
    while ((m = keyRegex.exec(code))) variables.add(m[1]);
  }

  const tagRegex = /<\/?([a-zA-Z][a-zA-Z0-9-]*)/g;
  while ((m = tagRegex.exec(code))) tags.add(m[1].toLowerCase());

  const keywords = LANG_KEYWORDS[lang] || [];
  if (keywords.length){
    const words = code.match(/[A-Za-z_$]+/g) || [];
    const wordSet = new Set(words);
    keywords.forEach(k => { if (wordSet.has(k)) syntax.add(k); });
  }

  return {
    variables: Array.from(variables).slice(0, 40),
    tags: Array.from(tags).slice(0, 40),
    syntax: Array.from(syntax).slice(0, 40)
  };
}

function renderStructurePanel(code, lang){
  const panel = document.getElementById('structurePanel');
  if (!panel) return;
  const data = analyzeCode(code, lang);
  const section = (title, items, cls) => {
    if (!items.length) return `<div class="structure-section"><h4>${title}</h4><div class="structure-empty">Sin resultados</div></div>`;
    return `<div class="structure-section"><h4>${title}</h4><div class="structure-chip-list">${items.map(i => `<span class="structure-chip ${cls}">${i}</span>`).join('')}</div></div>`;
  };
  panel.innerHTML = section('Variables', data.variables, 'var') + section('Tags', data.tags, 'tag') + section('Sintaxis', data.syntax, 'syn');
}

let acEl = null;
let acItems = [];
let acIndex = -1;
let acReplaceStart = 0;
let acReplaceEnd = 0;

function closeAutocomplete(){
  if (acEl){ acEl.remove(); acEl = null; }
  acItems = [];
  acIndex = -1;
}

function getCaretCoordinates(textarea){
  const mirror = document.createElement('div');
  const style = window.getComputedStyle(textarea);
  const props = ['boxSizing','width','fontFamily','fontSize','fontWeight','letterSpacing','lineHeight','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth'];
  props.forEach(p => { mirror.style[p] = style[p]; });
  mirror.style.position = 'absolute';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.top = '0';
  mirror.style.left = '-9999px';
  mirror.style.height = 'auto';
  document.body.appendChild(mirror);
  const value = textarea.value;
  const caret = textarea.selectionStart;
  const before = value.substring(0, caret);
  mirror.textContent = before;
  const span = document.createElement('span');
  span.textContent = value.substring(caret) || '.';
  mirror.appendChild(span);
  const rect = textarea.getBoundingClientRect();
  const coords = {
    top: rect.top + span.offsetTop - textarea.scrollTop,
    left: rect.left + span.offsetLeft - textarea.scrollLeft,
    height: span.offsetHeight
  };
  document.body.removeChild(mirror);
  return coords;
}

function getWordAtCaret(textarea){
  const value = textarea.value;
  const caret = textarea.selectionStart;
  let start = caret;
  while (start > 0 && /[A-Za-z0-9_$-]/.test(value[start - 1])) start--;
  return { word: value.slice(start, caret), start, end: caret };
}

function collectIdentifiers(code){
  const set = new Set();
  const matches = code.match(/[A-Za-z_$][A-Za-z0-9_$-]*/g) || [];
  matches.forEach(w => { if (w.length > 1) set.add(w); });
  return set;
}

function buildSuggestions(prefix, lang, code){
  if (!prefix) return [];
  const lower = prefix.toLowerCase();
  const pool = new Set([...(LANG_KEYWORDS[lang] || []), ...collectIdentifiers(code)]);
  return Array.from(pool)
    .filter(w => w.toLowerCase().startsWith(lower) && w.toLowerCase() !== lower)
    .sort((a, b) => a.length - b.length)
    .slice(0, 8);
}

function applySuggestion(textarea, value){
  const text = textarea.value;
  const newText = text.slice(0, acReplaceStart) + value + text.slice(acReplaceEnd);
  const newCaret = acReplaceStart + value.length;
  textarea.value = newText;
  textarea.setSelectionRange(newCaret, newCaret);
  closeAutocomplete();
  textarea.dispatchEvent(new Event('input'));
  textarea.focus();
}

function moveAutocomplete(delta){
  if (!acEl) return;
  const items = acEl.querySelectorAll('.ac-item');
  if (!items.length) return;
  items[acIndex].classList.remove('active');
  acIndex = (acIndex + delta + items.length) % items.length;
  items[acIndex].classList.add('active');
  items[acIndex].scrollIntoView({ block: 'nearest' });
}

function openAutocomplete(textarea, items, wordInfo){
  closeAutocomplete();
  if (!items.length) return;
  acItems = items;
  acIndex = 0;
  acReplaceStart = wordInfo.start;
  acReplaceEnd = wordInfo.end;
  const coords = getCaretCoordinates(textarea);
  acEl = document.createElement('div');
  acEl.className = 'autocomplete-box';
  acEl.innerHTML = items.map((it, i) => `<div class="ac-item${i === 0 ? ' active' : ''}">${it}</div>`).join('');
  document.body.appendChild(acEl);
  const boxHeight = acEl.offsetHeight;
  let top = coords.top + coords.height + 4;
  if (top + boxHeight > window.innerHeight) top = coords.top - boxHeight - 4;
  let left = coords.left;
  if (left + acEl.offsetWidth > window.innerWidth - 10) left = window.innerWidth - acEl.offsetWidth - 10;
  if (left < 10) left = 10;
  acEl.style.top = top + 'px';
  acEl.style.left = left + 'px';
  acEl.querySelectorAll('.ac-item').forEach((el, i) => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      applySuggestion(textarea, items[i]);
    });
  });
}

function getExt(name){
  return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
}

function getNodePath(id, node = state.root, currentPath = ''){
  if (node.id === id) return currentPath ? currentPath + '/' + node.name : node.name;
  if (node.children){
    for (const child of node.children){
      const nextPath = currentPath ? (node.id === 'root' ? '' : currentPath + '/') + node.name : (node.id === 'root' ? '' : node.name);
      const found = getNodePath(id, child, nextPath);
      if (found) return found;
    }
  }
  return null;
}

function isModelFile(path, name){
  const ext = getExt(name);
  if (MODEL_EXTS.includes(ext)) return true;
  if (ext === 'json'){
    const p = (path || name).toLowerCase();
    if (p.includes('models/') || p.includes('models\\') || p.includes('.geo.') || p.includes('.model.')) return true;
  }
  return false;
}

function fileMeta(node){
  const name = typeof node === 'string' ? node : node.name;
  const path = typeof node === 'object' ? getNodePath(node.id) : name;
  const ext = getExt(name);
  if (isModelFile(path, name)) return { isModel:true, isImage:false, bg:'var(--model)', color:'#fff' };
  if (IMAGE_EXTS.includes(ext)) return { isModel:false, isImage:true, bg:'#a855f7', color:'#fff' };
  if (FILE_TYPES[ext]) return Object.assign({ isModel:false, isImage:false }, FILE_TYPES[ext]);
  return { isModel:false, isImage:false, generic:true, lang:'plaintext' };
}

function getProjectsIndex(){
  try { return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]'); } catch(e){ return []; }
}

function saveProjectsIndex(list){
  localStorage.setItem(INDEX_KEY, JSON.stringify(list));
}

function updateIndexEntry(id, patch){
  const list = getProjectsIndex();
  const idx = list.findIndex(p => p.id === id);
  if (idx >= 0) list[idx] = Object.assign({}, list[idx], patch);
  else list.unshift(Object.assign({ id, cover: null }, patch));
  saveProjectsIndex(list);
}

function removeIndexEntry(id){
  saveProjectsIndex(getProjectsIndex().filter(p => p.id !== id));
}

function getUrlProjectId(){
  return new URLSearchParams(window.location.search).get('id');
}

function loadOrCreateProject(){
  const index = getProjectsIndex();
  let id = getUrlProjectId() || localStorage.getItem('devstudio_active_project');

  if (!id && index.length){
    id = index.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0].id;
  }

  if (id){
    const raw = localStorage.getItem(PROJECT_PREFIX + id);
    if (raw){
      try {
        const parsed = JSON.parse(raw);
        localStorage.setItem('devstudio_active_project', id);
        history.replaceState(null, '', window.location.pathname + '?id=' + id);
        return { id, name: parsed.name, root: parsed.root };
      } catch(e){}
    }
  }

  const newId = uid();
  const fresh = defaultProject();
  fresh.id = newId;
  localStorage.setItem(PROJECT_PREFIX + newId, JSON.stringify(fresh));
  updateIndexEntry(newId, { name: fresh.name, updatedAt: Date.now() });
  localStorage.setItem('devstudio_active_project', newId);
  history.replaceState(null, '', window.location.pathname + '?id=' + newId);
  return fresh;
}

function saveState(){
  localStorage.setItem(PROJECT_PREFIX + state.id, JSON.stringify({ id: state.id, name: state.name, root: state.root }));
  updateIndexEntry(state.id, { name: state.name, updatedAt: Date.now() });
}

function findNode(id, node = state.root){
  if (node.id === id) return node;
  if (node.children){
    for (const child of node.children){
      const found = findNode(id, child);
      if (found) return found;
    }
  }
  return null;
}

function findParent(id, node = state.root){
  if (node.children){
    for (const child of node.children){
      if (child.id === id) return node;
      const found = findParent(id, child);
      if (found) return found;
    }
  }
  return null;
}

function openMenu(anchorEl, items){
  closeMenu();
  const menu = document.createElement('div');
  menu.className = 'menu';
  items.forEach(item => {
    if (item.sep){
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      menu.appendChild(sep);
      return;
    }
    const el = document.createElement('div');
    el.className = 'menu-item' + (item.danger ? ' danger' : '');
    el.innerHTML = item.icon + '<span>' + item.label + '</span>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMenu();
      item.onClick();
    });
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  const rect = anchorEl.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.right - menuRect.width;
  if (top + menuRect.height > window.innerHeight) top = rect.top - menuRect.height - 6;
  if (left < 8) left = rect.left;
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  openMenuEl = menu;
}

function buildZipFromNode(zipFolder, node){
  if (node.type === 'file'){
    const meta = fileMeta(node);
    if (meta.isImage && node.content && node.content.startsWith('data:')){
      const base64Data = node.content.split(',')[1];
      zipFolder.file(node.name, base64Data, { base64: true });
    } else {
      zipFolder.file(node.name, node.content || '');
    }
  } else if (node.type === 'folder' && node.children){
    const targetFolder = node.id === 'root' ? zipFolder : zipFolder.folder(node.name);
    node.children.forEach(child => buildZipFromNode(targetFolder, child));
  }
}

function exportProjectFormat(ext){
  if (typeof JSZip === 'undefined'){
    alert('JSZip no está cargado');
    return;
  }
  const zip = new JSZip();
  buildZipFromNode(zip, state.root);
  zip.generateAsync({ type: 'blob' }).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.name || 'proyecto').replace(/[\/\\?%*:|"<>]/g, '_') + '.' + ext;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function downloadFile(id){
  const node = findNode(id);
  const meta = fileMeta(node);
  let href, revoke = false;
  if (meta.isImage && node.content){
    href = node.content;
  } else {
    const blob = new Blob([node.content || ''], { type: 'text/plain' });
    href = URL.createObjectURL(blob);
    revoke = true;
  }
  const a = document.createElement('a');
  a.href = href;
  a.download = node.name;
  a.click();
  if (revoke) URL.revokeObjectURL(href);
}

function renderFileIcon(node){
  const meta = fileMeta(node);
  if (meta.isImage){
    if (node.content && node.content.startsWith('data:')){
      return `<img class="node-thumb" src="${node.content}" alt="${node.name}">`;
    }
    return `<div class="file-badge" style="background:${meta.bg};color:${meta.color}">${ICONS.image}</div>`;
  }
  if (meta.isModel){
    return `<div class="file-badge" style="background:${meta.bg};color:${meta.color}">${ICONS.cube}</div>`;
  }
  if (meta.generic){
    return `<div class="node-icon file">${ICONS.file}</div>`;
  }
  return `<div class="file-badge" style="background:${meta.bg};color:${meta.color}">${meta.label}</div>`;
}

function renderNode(node, depth){
  const wrap = document.createElement('div');
  wrap.className = 'node' + (node.type === 'folder' && node.open ? ' open' : '');

  const row = document.createElement('div');
  row.className = 'node-row' + (selectedId === node.id ? ' selected' : '');
  row.style.paddingLeft = (9 + depth * 14) + 'px';

  const chevron = document.createElement('div');
  chevron.className = 'chevron' + (node.type === 'file' ? ' hidden' : '');
  chevron.innerHTML = ICONS.chevron;
  row.appendChild(chevron);

  const icon = document.createElement('div');
  if (node.type === 'folder'){
    icon.className = 'node-icon folder';
    icon.innerHTML = node.open ? ICONS.folderOpen : ICONS.folderClosed;
    row.appendChild(icon);
  } else {
    row.insertAdjacentHTML('beforeend', renderFileIcon(node));
  }

  if (renamingId === node.id){
    const input = document.createElement('input');
    input.className = 'node-name-input';
    input.value = node.name;
    row.appendChild(input);
    setTimeout(() => { input.focus(); input.select(); }, 0);
    const commit = () => {
      const val = input.value.trim();
      renamingId = null;
      if (val) renameNode(node.id, val); else render();
    };
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape'){ renamingId = null; render(); } });
    input.addEventListener('blur', commit);
  } else {
    const name = document.createElement('div');
    name.className = 'node-name';
    name.textContent = node.name;
    row.appendChild(name);
  }

  if (node.type === 'folder'){
    const count = document.createElement('div');
    count.className = 'node-count';
    count.textContent = node.children.length;
    row.appendChild(count);
  }

  const plus = document.createElement('div');
  plus.className = 'node-plus';
  plus.innerHTML = ICONS.plus;
  plus.title = 'Opciones';
  plus.addEventListener('click', (e) => {
    e.stopPropagation();
    const items = node.type === 'folder' ? folderMenuItems(node) : fileMenuItems(node);
    openMenu(plus, items);
  });
  row.appendChild(plus);

  row.addEventListener('click', () => selectNode(node));
  wrap.appendChild(row);

  if (node.type === 'folder'){
    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'node-children-wrap';
    const inner = document.createElement('div');
    inner.className = 'node-children-inner';
    const childrenEl = document.createElement('div');
    childrenEl.className = 'children';
    node.children.forEach(child => childrenEl.appendChild(renderNode(child, depth + 1)));
    inner.appendChild(childrenEl);
    childrenWrap.appendChild(inner);
    wrap.appendChild(childrenWrap);
  }

  return wrap;
}

function filterTree(node, query){
  if (!query) return true;
  if (node.name.toLowerCase().includes(query)) return true;
  if (node.children) return node.children.some(c => filterTree(c, query));
  return false;
}

function render(){
  const nameEl = document.getElementById('projectNameEl');
  nameEl.textContent = state.name;
  nameEl.title = state.name;

  const treeEl = document.getElementById('treeEl');
  treeEl.innerHTML = '';
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  state.root.children
    .filter(node => filterTree(node, query))
    .forEach(node => treeEl.appendChild(renderNode(node, 0)));
}

function renderEditor(){
  const editorEl = document.getElementById('editorEl');
  if (!activeFileId){
    editorEl.innerHTML = `
      <div class="empty-state">
        ${ICONS.emptyDoc}
        <p>Selecciona un archivo para editarlo</p>
      </div>
    `;
    return;
  }
  const node = findNode(activeFileId);
  const meta = fileMeta(node);

  if (meta.isImage){
    editorEl.innerHTML = `
      <div class="editor-header">
        <div class="editor-title">${ICONS.image}<b>${node.name}</b></div>
        <div class="header-btn-group">
          <button class="ghost-btn" id="downloadImgBtn">Descargar</button>
        </div>
      </div>
      <div class="image-preview-wrap" id="imgWrap"></div>
    `;
    const wrap = document.getElementById('imgWrap');
    if (node.content){
      wrap.innerHTML = `<img src="${node.content}" alt="${node.name}">`;
    } else {
      wrap.innerHTML = `
        <div class="image-preview-empty">
          ${ICONS.image}
          <p>Vista previa no disponible. Sube este archivo de imagen para poder visualizarlo aquí.</p>
        </div>
      `;
    }
    document.getElementById('downloadImgBtn').onclick = () => downloadFile(node.id);
    return;
  }

  structurePanelOpen = false;

  editorEl.innerHTML = `
    <div class="editor-header">
      <div class="editor-title">
        ${renderFileIcon(node)}
        <b>${node.name}</b>
        <span class="lang-pill">${meta.lang || 'texto'}</span>
      </div>
      <div class="header-btn-group">
        ${editorSettings.structure ? `<button class="ghost-btn" id="structureBtn">${ICONS.structure}<span>Estructura</span></button>` : ''}
        <button class="save-btn" id="saveFileBtn">Guardar</button>
      </div>
    </div>
    <div class="code-wrap">
      ${editorSettings.lineNumbers ? '<div class="line-numbers" id="lineNumbers"><div class="line-numbers-inner"></div></div>' : ''}
      <div class="code-scroll">
        <pre class="code-highlight"><code id="codeHighlight" class="language-${meta.lang || 'plaintext'}"></code></pre>
        <textarea class="code-area" id="codeArea" spellcheck="false"></textarea>
      </div>
    </div>
    ${editorSettings.structure ? '<div class="structure-panel" id="structurePanel"></div>' : ''}
  `;

  const textarea = document.getElementById('codeArea');
  const codeEl = document.getElementById('codeHighlight');
  const pre = codeEl.parentElement;
  const lineNumbersEl = document.getElementById('lineNumbers');

  function updateLineNumbers(){
    if (!editorSettings.lineNumbers || !lineNumbersEl) return;
    const lines = textarea.value.split('\n').length;
    let html = '';
    for (let i = 1; i <= lines; i++) html += '<div>' + i + '</div>';
    lineNumbersEl.querySelector('.line-numbers-inner').innerHTML = html;
  }

  function highlight(){
    const code = textarea.value;
    let html;
    try {
      html = hljs.highlight(code, { language: meta.lang || 'plaintext', ignoreIllegals: true }).value;
    } catch(e){
      html = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    codeEl.innerHTML = html + '\n';
    updateLineNumbers();
    if (editorSettings.structure) renderStructurePanel(code, meta.lang || 'plaintext');
  }

  textarea.value = node.content || '';
  highlight();

  textarea.addEventListener('input', highlight);
  textarea.addEventListener('scroll', () => {
    pre.scrollTop = textarea.scrollTop;
    pre.scrollLeft = textarea.scrollLeft;
    if (lineNumbersEl){
      lineNumbersEl.querySelector('.line-numbers-inner').style.transform = 'translateY(-' + textarea.scrollTop + 'px)';
    }
    closeAutocomplete();
  });

  if (editorSettings.structure){
    const structureBtn = document.getElementById('structureBtn');
    structureBtn.addEventListener('click', () => {
      structurePanelOpen = !structurePanelOpen;
      structureBtn.classList.toggle('active', structurePanelOpen);
      document.getElementById('structurePanel').classList.toggle('open', structurePanelOpen);
    });
  }

  if (editorSettings.autocomplete){
    textarea.addEventListener('keyup', (e) => {
      if (['Escape','ArrowUp','ArrowDown','Enter','Tab'].includes(e.key)) return;
      const info = getWordAtCaret(textarea);
      if (!info.word || info.word.length < 2){ closeAutocomplete(); return; }
      const suggestions = buildSuggestions(info.word, meta.lang || 'plaintext', textarea.value);
      if (suggestions.length) openAutocomplete(textarea, suggestions, info);
      else closeAutocomplete();
    });
    textarea.addEventListener('keydown', (e) => {
      if (!acEl) return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); moveAutocomplete(1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); moveAutocomplete(-1); }
      else if (e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); applySuggestion(textarea, acItems[acIndex]); }
      else if (e.key === 'Escape'){ closeAutocomplete(); }
    });
    textarea.addEventListener('blur', () => setTimeout(closeAutocomplete, 120));
  }

  document.getElementById('saveFileBtn').onclick = () => {
    node.content = textarea.value;
    saveState();
  };
}

document.getElementById('mobileToggleBtn').addEventListener('click', toggleMobileSidebar);
document.getElementById('mobileOverlay').addEventListener('click', closeMobileSidebar);

document.getElementById('addRootBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  openMenu(e.currentTarget, rootMenuItems());
});

document.getElementById('boxBtn').addEventListener('click', () => {
  showDownloadFormatModal();
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  showSettingsModal();
});

document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('fileUploadInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach(f => {
    const ext = getExt(f.name);
    const reader = new FileReader();
    if (IMAGE_EXTS.includes(ext)){
      reader.onload = () => addFile(uploadTargetFolderId, f.name, reader.result);
      reader.readAsDataURL(f);
    } else if (f.type.startsWith('text') || /\.(js|json|md|css|html|txt|yml|yaml|ts|tsx|jsx|py|sh)$/i.test(f.name)){
      reader.onload = () => addFile(uploadTargetFolderId, f.name, reader.result);
      reader.readAsText(f);
    } else {
      addFile(uploadTargetFolderId, f.name, '');
    }
  });
  e.target.value = '';
});

document.getElementById('folderUploadInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  const parent = findNode(uploadTargetFolderId);
  const cache = { '': parent };
  let pending = files.length;
  const finish = () => {
    pending -= 1;
    if (pending === 0){
      parent.open = true;
      saveState();
      render();
    }
  };
  files.forEach(f => {
    const path = f.webkitRelativePath.split('/');
    const fileName = path.pop();
    let currentPath = '';
    let currentNode = parent;
    path.forEach(part => {
      const nextPath = currentPath ? currentPath + '/' + part : part;
      if (!cache[nextPath]){
        const folderNode = { id: uid(), type: 'folder', name: part, open: false, children: [] };
        currentNode.children.push(folderNode);
        cache[nextPath] = folderNode;
      }
      currentNode = cache[nextPath];
      currentPath = nextPath;
    });
    const ext = getExt(fileName);
    if (IMAGE_EXTS.includes(ext)){
      const reader = new FileReader();
      reader.onload = () => {
        currentNode.children.push({ id: uid(), type: 'file', name: fileName, content: reader.result });
        finish();
      };
      reader.readAsDataURL(f);
    } else {
      currentNode.children.push({ id: uid(), type: 'file', name: fileName, content: '' });
      finish();
    }
  });
  e.target.value = '';
});

state = loadOrCreateProject();
render();
renderEditor();
</script>
</body>
</html>
